# Dokploy configuration file (can also be used as standard docker-compose)
version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: professional-pos-cashier:latest
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # -- Database Settings --
      # In Dokploy, you will set these in the "Environment" tab of your application
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      # -- Application Secrets --
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:4000/api/auth/me" ]
      interval: 30s
      timeout: 10s
      retries: 3
